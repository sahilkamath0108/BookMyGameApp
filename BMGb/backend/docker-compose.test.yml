# Disposable PostgreSQL for the test suite. Data lives in memory and is gone on stop.
services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bmg_test
      POSTGRES_USER: bmg_test
      POSTGRES_PASSWORD: bmg_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bmg_test -d bmg_test"]
      interval: 2s
      timeout: 2s
      retries: 15
